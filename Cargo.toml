[workspace]
members = [
    "crates/ghost-protocol",
    "crates/ghost-net",
    "crates/ghost-engine",
    "crates/ghost-bnet",
    "crates/ghost-spectator",
    "crates/ghost-store",
    "crates/ghostrs",
    "crates/ghost-loadtest",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
authors = ["Ghost-RS Team"]

[workspace.dependencies]
bytes = "1.10.1"
tokio = { version = "1.45.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
crc32fast = "1.4"
sha1 = "0.10.6"
rand = "0.9.1"
mpq = "0.8"
flate2 = "1.1.1"
proptest = "1.5"
criterion = "0.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
num-bigint = "0.4.6"
num-traits = "0.2.19"
