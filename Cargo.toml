[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
authors = ["Ghost-RS Team"]

[workspace.dependencies]
bytes = "1.10.1"
tokio = { version = "1.45.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
crc32fast = "1.4"
sha1 = "0.10.6"
rand = "0.9.1"
flate2 = "1.1.1"
proptest = "1.5"
criterion = "0.5"

[package]
name = "ghostrs-legacy"
version = "0.2.0"
edition = "2024"
description = "Legacy GHost++ transliteration, retired module-by-module"

[[bin]]
name = "ghostrs-legacy"
path = "src/main.rs"

[dependencies]
byteorder = "1.5.0"
bytes = "1.10.1"
config = "0.15.11"
crc32fast = "1.4"
flate2 = "1.1.1"
libloading = "0.8.7"
log = "0.4.27"
mpq = "0.8"
once_cell = "1.21.3"
paris = { version = "1.5.15", features = ["timestamps", "macros"] }
parking_lot = "0.12"
rand = "0.9.1"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10.6"
socket2 = "0.5.9"
thiserror = "2.0"
tokio = { version = "1.45.0", features = ["full"] }
uuid = { version = "1.17.0", features = ["v4"] }
