[package]
name = "ghostrs"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
bytes = "1.10.1"
config = "0.15.11"
flate2 = "1.1.1"
libc = "0.2.172"
libloading = "0.8.7"
log = "0.4.27"
mpq = "0.8"
once_cell = "1.21.3"
paris = { version = "1.5.15", features = ["timestamps", "macros"] }
queue = "0.3.2-final"
rand = "0.9.1"
serde = { version="1.0.219", features=["derive"]}

sha1 = "0.10.6"
socket2 = "0.5.9"
tokio = { version = "1.45.0", features = [ "full", "macros", "io-util" ] }
uuid = "1.17.0"
