[workspace]
members = [
    "crates/spectre-protocol",
    "crates/spectre-net",
    "crates/spectre-engine",
    "crates/spectre-bnet",
    "crates/spectre-spectator",
    "crates/spectre-store",
    "crates/spectre",
    "crates/spectre-loadtest",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
authors = ["Spectre Team"]

[workspace.dependencies]
bytes = "1.10.1"
tokio = { version = "1.45.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
crc32fast = "1.4"
sha1 = "0.10.6"
rand = "0.9.1"
mpq = "0.8"
flate2 = "1.1.1"
proptest = "1.5"
criterion = "0.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
num-bigint = "0.4.6"
num-traits = "0.2.19"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev.package."*"]
opt-level = 2

