services:
  spectre:
    image: ghcr.io/maybewewill/spectre:latest
    container_name: spectre
    restart: unless-stopped
    entrypoint: ["/app/spectre"]
    # host networking ensures direct high-performance socket access without Docker bridge/NAT overhead
    network_mode: host
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    volumes:
      - ./spectre.toml:/app/spectre.toml:ro
      - ./maps:/app/maps:ro
      - ./war3:/app/war3:ro
      - ./replays:/app/replays:rw
      - ./data:/app/data:rw
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: 5